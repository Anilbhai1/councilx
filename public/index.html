<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Council X | The 216 Supreme Syndicate</title>
    <meta name="description" content="The World's 216 Greatest Minds in Your Private War Room. Civilizational Strategy, Dharmic Wisdom & Hyper-Scale Execution." />
    
    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CouncilX" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        max-width: 100vw;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #050505;
        overflow-x: hidden !important;
        position: relative;
        -webkit-overflow-scrolling: touch;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        width: 100%;
        max-width: 100vw;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden !important;
        display: flex;
        flex-direction: column;
      }
      img, svg, video, canvas {
        max-width: 100%;
        height: auto;
      }
    </style>
    
    <script>
      // Early capture of native beforeinstallprompt event (Chrome, Android, Edge, Brave)
      window.__councilx_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__councilx_deferred_prompt = e;
        if (typeof window.__councilx_on_before_install === 'function') {
          window.__councilx_on_before_install(e);
        }
      });

      // Standalone Service Worker Registration with readyState check
      if ('serviceWorker' in navigator) {
        function registerSW() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('✅ CouncilX ServiceWorker registered. Scope:', reg.scope);
          }).catch(function(err) {
            console.warn('ℹ️ ServiceWorker registration notice:', err);
          });
        }
        if (document.readyState === 'complete') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="color: #fff; background: #050505; padding: 24px; text-align: center; font-family: sans-serif;">
        You need to enable JavaScript to run Council X.
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
